version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=file:./dev.db
      - PORT=5000
      - JWT_SECRET=campusos_super_secret_jwt_key_2026_prod
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_SECRET=campusos_refresh_token_secret_key_2026_prod
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=production
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
